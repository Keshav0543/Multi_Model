name: Build and deploy Node.js app to Azure Web App - multimodal-rag-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble deployment package
        run: |
          mkdir -p deploy/Backend deploy/frontend/dist

          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='uploads/' \
            --exclude='.tmp-test-session.txt' \
            --exclude='node_modules/' \
            Backend/ deploy/Backend/

          cp -R frontend/dist/. deploy/frontend/dist/
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

      - name: Create deployment ZIP
        run: |
          cd deploy
          zip -qr ../app.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5EA23452506B46D2AD9832185D1C24C9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B58D2BED8DD24208938F85EFC3D76D84 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4AF6555F35E242AAAF576246B66D88DE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: multimodal-rag-api
          slot-name: Production
          package: app.zip